name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check
      - name: Test
        working-directory: backend
        run: python -m pytest -q tests

  frontend:
    name: Frontend (check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Lineup swap checks
        run: node src/lockin/swaps.check.mjs
      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t nba-fantasy-tool .

  deploy:
    name: Deploy to fantasy.sawyerpham.dev
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}   # until the secret is added, the job passes without deploying
    steps:
      - name: Redeploy over SSH
        if: env.HAS_KEY == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # the server's host key, pinned so the runner never trusts a different machine
          HOST_KEY: fantasy.sawyerpham.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINO1atayZVp0RD1wNtmPMPfxzmrvBpzoHttd5C3Igycw
        run: |
          install -d -m 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$HOST_KEY" > ~/.ssh/known_hosts
          # the key's forced command (deploy/cd.sh) pulls main, rebuilds and waits for the app to be healthy
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ubuntu@fantasy.sawyerpham.dev
      - name: Check the site answers
        if: env.HAS_KEY == 'true'
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors https://fantasy.sawyerpham.dev/api/health
